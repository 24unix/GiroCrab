name: AI Transparency

# Living-Lab "AI-enabled Transparency of AI Use in Software Creation Processes".
# Builds the 🦀 AI Provenance & Transparency Card for every PR, including fork PRs.
# See docs/ai-transparency.md.
#
# SECURITY: `pull_request_target` runs with a write token and secrets, so this job must
# never execute or check out code from the PR. It checks out the trusted base commit only
# and reads the PR (title, body, commits, file paths) through the GitHub API as plain data.
# The classifier therefore always comes from the base branch: a PR cannot change how its own
# provenance is assessed. Changes to this file take effect once merged.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write # sticky PR comment (issues API on a PR needs this)
  issues: read
  models: read # GitHub Models fallback for the layer-3 meta-audit

concurrency:
  group: ai-transparency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted base commit, never the PR head.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools
          persist-credentials: false

      - name: Build provenance card
        env:
          GH_TOKEN: ${{ github.token }}
          # Layer 3 (meta-audit): Gemini if the secret exists, else GitHub Models via the
          # job token. The script only sends sanitized metadata and never fails the card.
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if python3 tools/export-ai-provenance.py card --pr "$PR" --out card.md; then
            cat card.md >> "$GITHUB_STEP_SUMMARY"
            echo "<sub>Verifier: \`base@${GITHUB_SHA::7}\`</sub>" >> "$GITHUB_STEP_SUMMARY"
          else
            # informational check: never block a PR on a GitHub API hiccup
            echo "::warning::AI provenance card could not be built"
            echo "⚠️ AI provenance card could not be built (see log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update PR comment
        if: ${{ hashFiles('card.md') != '' }}
        continue-on-error: true # never fail the run over a comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/export-ai-provenance.py comment --pr "$PR" --file card.md
