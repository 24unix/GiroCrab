name: Android Build

on:
  push:
    branches: [ feat/android-parity ]
    paths:
      - 'GiroCrabAndroid/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships the Android SDK; skip setup-android (its sdkmanager step failed) and just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: GiroCrabAndroid
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiroCrab-Android-debug-apk
          path: GiroCrabAndroid/app/build/outputs/apk/debug/*.apk
