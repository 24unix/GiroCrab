name: Android Build

on:
  push:
    branches: [main, feat/android-parity, fix/android-workflow-green]
    paths: ['GiroCrabAndroid/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['GiroCrabAndroid/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships the Android SDK; skip setup-android (its sdkmanager step failed) and just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: GiroCrabAndroid
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Check APK
        working-directory: GiroCrabAndroid
        run: |
          ls -la app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/*.apk | grep -c 'classes.*\.dex'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: girocrab-android-debug-apk
          path: GiroCrabAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
