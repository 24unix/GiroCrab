name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p girocrab-core --all-targets
      - run: cargo test -p girocrab-core

  swift:
    runs-on: macos-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust core + UniFFI bindings (macOS only)
        run: ./build-xcframework.sh --macos-only
      - name: Build SwiftUI app
        run: cd GiroCrabApp && swift build
