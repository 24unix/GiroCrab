name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: new advisories appear without any change in this repository.
  schedule:
    - cron: "0 5 * * 1"

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

# Neuer Push auf denselben PR bricht den laufenden Lauf ab (macOS-Runner sind knapp).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed (PRs only; pushes to main always run everything). The jobs below keep
  # their names and always report, so required checks never hang on "pending"; only the
  # expensive steps are skipped when the PR cannot affect them. The cheap lint steps of
  # `rust` (fonts, brand names, catalogs, ...) also guard Swift and docs, so they always run.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      swift: ${{ steps.f.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: |
          rust=true; swift=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            # Rust core, workspace manifests, Linux front end, CI itself
            echo "$files" | grep -qE '^(girocrab-core/|GiroCrabLinux/|Cargo\.(toml|lock)$|\.github/|build-xcframework\.sh$)' || rust=false
            # Swift app, the core behind it (bindings), CI itself
            echo "$files" | grep -qE '^(GiroCrabApp/|girocrab-core/|Cargo\.(toml|lock)$|\.github/|build-xcframework\.sh$)' || swift=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  # Known vulnerabilities / unmaintained crates in Cargo.lock (RustSec). Warnings fail the job;
  # accepted exceptions live in `.cargo/audit.toml` with a reason.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --deny warnings

  # `rust` and `swift` deliberately run in parallel and independently: a red
  # fmt/Clippy/Rust test run must not hide the Swift build, and vice versa.
  # The job names stay unchanged so existing required checks keep matching.
  rust:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - name: No FinTS product ID in the repo
        run: scripts/fints-registrierung.sh scan
      - name: THIRD_PARTY_NOTICES.md covers all direct dependencies
        run: scripts/check-third-party-notices.sh
      - name: No vault access from views (only via AppModel)
        run: scripts/lint-vault-access.sh
      - name: AppModel internals only in AppModel*.swift
        run: scripts/lint-appmodel-internals.sh
      - name: Text styles via .appFont (scale with the text size)
        run: scripts/lint-fonts.sh
      - name: No macOS-only APIs outside #if os(macOS) (iOS build)
        run: scripts/lint-ios-compat.sh
      - name: No third-party software brands in user-visible texts
        run: scripts/lint-brand-names.sh
      - name: String catalogs sorted (scripts/xcstrings.py format)
        run: scripts/xcstrings.py check
      - name: Test String-Catalog-Merge-Driver
        run: python3 -m unittest scripts/test_xcstrings.py scripts/test_sync_docs.py
      - name: Test AI provenance classifier
        run: python3 -m unittest tools/test_export_ai_provenance.py
      - name: Test FNZ portal browser scripts
        run: node --test scripts/test-fnz-portal.cjs scripts/test-quirion-portal.cjs
      - name: FFI types carry the optional serde derive (front ends without UniFFI)
        run: scripts/lint-serde-feature.sh
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: girocrab-core builds with the optional serde feature
        if: needs.changes.outputs.rust == 'true'
        run: cargo check -p girocrab-core --features serde
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace

  swift:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: needs.changes.outputs.swift == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: needs.changes.outputs.swift == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build Rust core + UniFFI bindings (macOS only)
        if: needs.changes.outputs.swift == 'true'
        run: ./build-xcframework.sh --macos-only
      - name: Stale-bindings check (build-xcframework.sh --check)
        if: needs.changes.outputs.swift == 'true'
        run: |
          ./build-xcframework.sh --check
          echo '// stale' >> girocrab-core/src/text.rs
          if ./build-xcframework.sh --check; then echo "--check missed a core change" >&2; exit 1; fi
          git checkout -- girocrab-core/src/text.rs
          ./build-xcframework.sh --check
      - name: Build SwiftUI app
        if: needs.changes.outputs.swift == 'true'
        run: cd GiroCrabApp && swift build
      - name: Test SwiftUI app
        if: needs.changes.outputs.swift == 'true'
        run: cd GiroCrabApp && swift test
