name: Flatpak

# Flatpak of the Linux port (GiroCrabLinux/packaging/flatpak/): a .flatpak bundle per
# architecture as a workflow artifact, for Fedora, openSUSE, Arch and other distributions
# without a .deb. Nothing is published (no Flathub, no release). Same triggers as linux.yml.
on:
  push:
    branches: [main]
    paths: ['GiroCrabLinux/**', 'girocrab-core/**', '**/Localizable.xcstrings', '.github/workflows/flatpak.yml']
  pull_request:
    paths: ['GiroCrabLinux/**', 'girocrab-core/**', '**/Localizable.xcstrings', '.github/workflows/flatpak.yml']
  workflow_dispatch:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The offline crate list must match GiroCrabLinux/Cargo.lock, otherwise the build below
  # fails with a missing crate (or silently keeps an old version).
  cargo-sources:
    name: cargo-sources.json aktuell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'aiohttp>=3.9.5,<4' 'PyYAML>=6.0.2,<7' 'tomlkit>=0.13.3,<1'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Compare with Cargo.lock
        run: GiroCrabLinux/packaging/flatpak/update-cargo-sources.sh --check

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The image ships the KDE runtimes preinstalled; updating them renames directories of
      # the image's lower overlayfs layer, which fails with "Invalid cross-device link"
      # (seen on the x86_64 runners). A full copy lives in the writable layer.
      - name: Flatpak-Installation in die beschreibbare Schicht kopieren
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: GiroCrabLinux/packaging/flatpak/de.girocrab.GiroCrab.yml
          bundle: girocrab.flatpak
          arch: ${{ matrix.arch }}
          cache: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('GiroCrabLinux/packaging/flatpak/**') }}
          upload-artifact: true
