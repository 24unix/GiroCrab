name: Release

# macOS release artifacts are NOT built or uploaded by CI.
# Signing (Developer ID), notarization and stapling happen 100% locally on the
# maintainer's Mac (keychain identity + `notary-profile`), deliberately without
# Apple certificates in GitHub Secrets:
#
#   ./scripts/notarize.sh --upload vX.Y.Z   # build, sign, notarize, verify, gh release upload
#
# CI only creates a draft release (with generated notes, no binary) on tag push,
# so a non-notarized binary can never end up attached to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create draft release (no binary)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
